apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ynab-companion-hpa
  labels:
    app.kubernetes.io/name: ynab-companion
    app.kubernetes.io/part-of: ynab-companion-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ynab-companion
  # Scale down to 1 replica during low load for minimal cost
  minReplicas: 1
  # Scale up to 10 replicas under peak traffic
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # 5-minute stabilization window prevents rapid thrashing
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0 # Immediate scale up on traffic burst
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
