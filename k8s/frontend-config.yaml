apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: ynab-companion-frontend-config
  labels:
    app.kubernetes.io/name: ynab-companion
    app.kubernetes.io/part-of: ynab-companion-app
spec:
  # Automatically redirects all HTTP (port 80) traffic to HTTPS (port 443) at GCP Load Balancer edge
  redirectToHttps:
    enabled: true
    responseCodeName: MOVED_PERMANENTLY_DEFAULT # HTTP 301
