apiVersion: v1
kind: ConfigMap
metadata:
  name: ynab-companion-config
  labels:
    app.kubernetes.io/name: ynab-companion
    app.kubernetes.io/part-of: ynab-companion-app
data:
  NODE_ENV: "production"
  PORT: "3000"
  NEXT_TELEMETRY_DISABLED: "1"

  # Database Engine: 'postgres' for Google Cloud SQL
  DB_TYPE: "postgres"
  DB_HOST: "127.0.0.1" # Connects via the Cloud SQL Auth Proxy sidecar container
  DB_PORT: "5432"
  DB_NAME: "ynab_companion"
  DB_SSL: "false" # Proxy-to-app connection is local loopback; proxy enforces mTLS to Cloud SQL
  DB_MAX_CONNECTIONS: "10"

  # GCP Cloud SQL Instance Connection Name
  # Format: <GCP_PROJECT_ID>:<REGION>:<INSTANCE_NAME>
  # Replace with your actual Cloud SQL instance details
  INSTANCE_CONNECTION_NAME: "YOUR_PROJECT_ID:us-central1:ynab-companion-db"
