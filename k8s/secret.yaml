apiVersion: v1
kind: Secret
metadata:
  name: ynab-companion-secrets
  labels:
    app.kubernetes.io/name: ynab-companion
    app.kubernetes.io/part-of: ynab-companion-app
type: Opaque
stringData:
  # 32-byte / 64-hex character AES key for AES-256-GCM data encryption at rest.
  # Generate using: openssl rand -hex 32
  ENCRYPTION_KEY: "CHANGE_ME_GENERATE_WITH_OPENSSL_RAND_HEX_32"

  # Cloud SQL PostgreSQL database credentials
  DB_USER: "ynab_user"
  DB_PASSWORD: "CHANGE_ME_STRONG_DATABASE_PASSWORD"

  # Optional direct connection string format
  DATABASE_URL: "postgresql://ynab_user:CHANGE_ME_STRONG_DATABASE_PASSWORD@127.0.0.1:5432/ynab_companion?sslmode=disable"

  # Optional fallback YNAB Personal Access Token (can also be entered via UI Settings)
  YNAB_ACCESS_TOKEN: ""
