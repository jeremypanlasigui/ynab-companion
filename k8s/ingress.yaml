apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ynab-companion-ingress
  labels:
    app.kubernetes.io/name: ynab-companion
    app.kubernetes.io/part-of: ynab-companion-app
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: "ynab-companion-cert"
    networking.gke.io/v1beta1.FrontendConfig: "ynab-companion-frontend-config"
    # Optional: Attach a reserved Google Cloud Global Static External IP
    # Run: gcloud compute addresses create ynab-companion-ip --global
    # kubernetes.io/ingress.global-static-ip-name: "ynab-companion-ip"
spec:
  defaultBackend:
    service:
      name: ynab-companion-service
      port:
        number: 80
  rules:
    - host: "ynab.example.com" # Replace with your custom domain
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: ynab-companion-service
                port:
                  number: 80
